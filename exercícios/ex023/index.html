<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table{
            width: 400px;
            border-collapse: collapse;
            height: 300px;
        }
        td{
            border: black 1px solid;
            padding: 06px;
            text-align: right;
            vertical-align: bottom;
        }
        .esqcima{
            vertical-align: top;
            text-align: left;
        }
        .meio{
            vertical-align: middle;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tabela</h1>

    <table>
        <tr>
            <td>a1</td>
            <td class="meio">a2
            <td class="meio">a3</td>
        </tr>
        <tr>
            <td class="meio">b1
            <td class="meio">55</td>
            <td class="meio">b3
        </tr>
        <tr>
            <td class="meio">c1</td>
            <td class="meio">c2
            <td class="esqcima">c3</td>
        </tr>
    </table>

</body>
</html>
