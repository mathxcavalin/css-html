<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            margin: 10px;
        }

        caption{
            font-weight: bold;
            font-size: 1.2em;
        }

        th, td, caption{
            border: 1px solid black;
            padding: 5px;
        }
        .cNomes{
            background-color: rgb(177, 174, 174);
        }

    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cNomes">
            <col>
            <col>
        </colgroup>

        <caption>Cadastro</caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Matheus</td>
                <td>18</td>
                <td>Estudante</td>
            </tr>
            <tr>
                <td>Gustavo</td>
                <td>46</td>
                <td>Professor</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
