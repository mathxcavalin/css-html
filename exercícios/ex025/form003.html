<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Média dos Alunos</h1>
    <form action="" method="get">
        <label for="name">Digite seu nome: </label>
        <input type="text" name="name" id="name" autocomplete="name" placeholder="Nome Completo" minlength="5" maxlength="40">
        <br>
        <label for="nota1">Nota 1:</label>
        <input type="number" name="nota1" id="nota1" placeholder="0 a 10" min="0" max="10" step="0.1" required>
        <label for="nota2">Nota 2:</label>
        <input type="number" name="nota2" id="nota2" placeholder="0 a 10" min="0" max="10" step="0.1" required>
        <br>
        
        <input type="button" value="Enviar" onclick="calcular()">
        <input type="reset" value="Limpar">
    </form>
    <p id="notaFinal"></p>

    <script>
        function calcular(){
            let resp = document.getElementById('notaFinal')
            let name = document.getElementById('name').value
            let n1 = +document.getElementById('nota1').value
            let n2 = +document.getElementById('nota2').value
            let media = (n1+n2)/2
            resp.innerHTML = `A nota final de ${name} foi ${media.toFixed(2)}`
        }
    </script>

</body>
</html>
