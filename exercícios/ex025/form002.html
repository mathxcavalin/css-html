<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <div>
            <label for="user">Usuário: </label>
            <input type="text" name="user2" id="user" required minlength="3" maxlength="30" autocomplete="username">
            <label for="password">Senha: </label>
            <input type="password" name="password2" id="password" minlength="8" maxlength="8" required autocomplete="current-password">
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
